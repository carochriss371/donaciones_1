name: Actualizar Datos desde Apps Script

on:
  repository_dispatch:
    types: [update-data]

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Verificar Secret
        env:
          SECRET: ${{ github.event.client_payload.secret }}
          EXPECTED_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          if [ -n "$EXPECTED_SECRET" ] && [ "$EXPECTED_SECRET" != "$SECRET" ]; then
            echo "❌ Secret inválido"
            exit 1
          fi
          echo "✅ Secret verificado correctamente"

      - name: Procesar y Guardar JSON
        env:
          RAW_DATA: ${{ github.event.client_payload.data }}
          IS_COMPRESSED: ${{ github.event.client_payload.compressed }}
        shell: python
        run: |
          import json
          import os
          import base64
          import zlib

          raw_data = os.environ.get("RAW_DATA", "")
          is_compressed = str(os.environ.get("IS_COMPRESSED", "false")).lower() == "true"
          
          try:
              if is_compressed:
                  # Decodificar base64
                  decoded = base64.b64decode(raw_data)
                  # Descomprimir gzip/zlib
                  decompressed = zlib.decompress(decoded, 16 + zlib.MAX_WBITS)
                  # Parsear JSON
                  data = json.loads(decompressed.decode('utf-8'))
                  print("✅ Datos descomprimidos correctamente")
              else:
                  # Datos sin comprimir
                  data = json.loads(raw_data)
                  if isinstance(data, str):
                      data = json.loads(data)
          except Exception as e:
              print(f"❌ Error al decodificar payload: {e}")
              raise SystemExit(1)

          # Crear carpetas si no existen
          os.makedirs("data", exist_ok=True)
          os.makedirs("public/data", exist_ok=True)

          files = {
              "data/contabilidad.json": data.get("contabilidades", []),
              "data/inventario.json": data.get("inventario", []),
              "data/entradas.json": data.get("entradas", []),
              "data/donado.json": data.get("donado", []),
              "data/metadata.json": {
                  "summary": data.get("summary", {}),
                  "timestamp": data.get("timestamp", "")
              },
              "public/data/contabilidad.json": data.get("contabilidades", []),
              "public/data/inventario.json": data.get("inventario", []),
              "public/data/entradas.json": data.get("entradas", []),
              "public/data/donado.json": data.get("donado", []),
              "public/data/metadata.json": {
                  "summary": data.get("summary", {}),
                  "timestamp": data.get("timestamp", "")
              }
          }

          for path, content in files.items():
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(content, f, ensure_ascii=False, indent=2)

          print("✅ Todos los archivos JSON fueron procesados y guardados correctamente.")

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/ public/data/
          git diff --staged --quiet || git commit -m "Actualizar datos desde Apps Script $(date +'%Y-%m-%d %H:%M:%S')"
          git push